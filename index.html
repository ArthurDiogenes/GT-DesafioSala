<html data-theme="dark">
  <head>
    <title>Login - Geração Tech 15</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4.0.0/dist/full.css"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen flex items-center justify-center bg-base-200">
    <div class="w-full max-w-sm p-8 rounded-2xl shadow-xl bg-base-100">
      <h2 class="text-2xl font-bold text-center mb-6">Geração Tech</h2>
      <form class="space-y-4">
        <div class="form-control">
          <label class="label">
            <span class="label-text">E-mail</span>
          </label>
          <input
            type="email"
            placeholder="exemplo@email.com"
            class="input input-bordered w-full"
          />
        </div>
        <div class="form-control">
          <label class="label">
            <span class="label-text">Senha</span>
          </label>
          <input
            type="password"
            placeholder="********"
            class="input input-bordered w-full"
          />
        </div>
        <a
          href="aluno.html"
          class="btn btn-primary w-full transition duration-300 hover:scale-105"
        >
          Entrar
        </a>
      </form>
    </div>
  </body>
</html>
